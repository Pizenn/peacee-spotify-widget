<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spotify Widget</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* KUNCI UTAMA: Memaksa dasar aplikasi benar-benar tembus pandang */
    html, body {
      background-color: transparent !important;
    }
    /* Animasi untuk Visualizer */
    @keyframes equalize {
      0% { height: 3px; }
      50% { height: 12px; }
      100% { height: 3px; }
    }
    .bar {
      width: 3px;
      background-color: #1DB954;
      border-radius: 2px;
      transition: height 0.2s ease;
    }
    .playing .bar { animation: equalize 1s infinite ease-in-out; }
    .bar:nth-child(1) { animation-delay: 0.0s; }
    .bar:nth-child(2) { animation-delay: 0.3s; }
    .bar:nth-child(3) { animation-delay: 0.6s; }
    .bar:nth-child(4) { animation-delay: 0.2s; }
  </style>
</head>
<!-- Body HANYA bertugas sebagai wadah yang kosong dan transparan -->
<body class="m-0 h-screen w-screen font-sans overflow-hidden select-none p-0 flex items-center justify-center">
  
  <div class="w-full h-full bg-black/80 backdrop-blur-2xl rounded-2xl border border-white/10 flex flex-col justify-between overflow-hidden" style="-webkit-app-region: drag;">
    <div class="flex items-center gap-4 px-4 h-full w-full">
      
      <!-- Cover Album -->
      <div class="flex-shrink-0 w-[64px] h-[64px] rounded-md overflow-hidden border border-white/10 shadow-lg">
        <img id="album-art" src="https://via.placeholder.com/64" class="w-full h-full object-cover">
      </div>
      
      <!-- Info Teks & Visualizer -->
      <div class="flex flex-col flex-grow min-w-0 justify-center">
        
        <div class="flex items-baseline justify-between w-full min-w-0 gap-3">
          <h1 id="track-title" class="text-base font-bold text-[#1DB954] truncate flex-1">Menunggu Lagu...</h1>
          
          <!-- Artis dan Visualizer digabung di kanan -->
          <div class="flex items-center gap-2 flex-shrink-0 max-w-[45%]">
            <p id="track-artist" class="text-xs text-gray-300 font-medium truncate text-right">-</p>
            <!-- Kontainer Visualizer -->
            <div id="visualizer" class="flex items-end gap-[2px] h-[12px]">
              <div class="bar h-[3px]"></div>
              <div class="bar h-[8px]"></div>
              <div class="bar h-[5px]"></div>
              <div class="bar h-[12px]"></div>
            </div>
          </div>
        </div>
        
        <!-- Lirik -->
        <p id="lyrics-container" class="text-[13px] text-white italic truncate mt-1 opacity-90 font-medium tracking-wide">
          Lirik akan muncul di sini
        </p>
      </div>
      
    </div>

    <!-- Progress Bar -->
    <div class="w-full bg-white/10 h-1 flex-shrink-0">
      <div id="progress-bar" class="bg-[#1DB954] h-full w-0 transition-all duration-1000 ease-linear"></div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
